version: 2

models:
  - name: stg_stores
    description: One row per store, as the store systems team publishes them.
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
      - name: pricing_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'metro', 'airport']

  - name: stg_menu_items
    description: The menu as merchandising maintains it, active and retired items alike.
    columns:
      - name: item_id
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ['bowl', 'burrito', 'side', 'drink']

  - name: stg_pricing_tiers
    columns:
      - name: pricing_tier
        data_tests:
          - unique
          - not_null

  - name: stg_promotions
    columns:
      - name: promo_code
        data_tests:
          - unique
          - not_null

  - name: stg_price_calendar
    columns:
      - name: price_date
        data_tests:
          - unique
          - not_null
