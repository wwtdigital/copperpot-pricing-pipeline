name: 'copperpot_pricing'

config-version: 2
version: '0.1'

profile: 'copperpot_pricing'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_packages"
    - "logs"

require-dbt-version: [">=1.11.0", "<2.0.0"]

seeds:
  copperpot_pricing:
    +docs:
      node_color: '#cd7f32'

models:
  copperpot_pricing:
    staging:
      +materialized: view
      +docs:
        node_color: 'silver'
    marts:
      +materialized: table
      +docs:
        node_color: 'gold'
