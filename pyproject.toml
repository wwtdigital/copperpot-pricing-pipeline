[project]
name = "copperpot-pricing-pipeline"
version = "0.1.0"
description = "Menu pricing and promotion jobs for the Copperpot Bowls commerce API: dbt models on DuckDB"
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb==1.11.0",
    "dbt-core==1.12.5",
    "sqlfluff==4.3.0",
    # Constrain chardet to avoid RequestsDependencyWarning from requests
    "chardet<6",
]
